name: deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  find-changes:
    runs-on: ubuntu-latest
    steps:
      - name: detect changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            src:
              - 'src/**'
