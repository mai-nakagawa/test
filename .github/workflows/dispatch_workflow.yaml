name: dispatch_workflow

on:
  workflow_dispatch:
    inputs:
      discounted_interest_training:
        type: boolean
        required: true
        description: "引き下げ金利モデルを学習する"
      table_suffix:
        type: string
        required: false
        description: "テーブル名の末尾に追加する文字列（通常は省略）"

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: "!!パラメータを確認してください!!"
        run: |
          echo "-------------- 以下のパラメータを確認してください ----------------"
          echo "table_suffix: \"${{ inputs.table_suffix }}\"" （通常は空文字列）
          echo "discounted_interest_training: \"${{ inputs.discounted_interest_training }}\"" （引き下げ金利モデルを学習するときはtrue）
          echo "------------------------------------------------------------"

  trigger:
    runs-on: ubuntu-latest
    needs: sample
    environment: trigger_job_on_production
    steps:
      - run: echo triggered!!
