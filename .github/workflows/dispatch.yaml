name: dispatch

on:
  workflow_dispatch:
    inputs:
      release_target_date:
        description: "Release target date (YYYY-MM-01)"
        required: true
        type: string

run-name: 'Trigger deployment ({{ inputs.release_target_date }})'

jobs:
  trigger_deployment:
    runs-on: ubuntu-latest
    environment: trigger_job_on_production
    steps:
      - name: Trigger deployment
        run: |
          echo "Triggering deployment..."
          echo "Release target date: ${{ inputs.release_target_date }}"
