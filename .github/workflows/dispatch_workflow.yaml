name: dispatch_workflow

on:
  workflow_dispatch:
    inputs:
      abc:
        type: boolean
        required: true
      table_suffix:
        type: string
        required: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: hello
        run: echo "Hello, world! ${{ inputs.abc }} ${{ inputs.table_suffix }}"
